{% comment %}
  Moss Grotto scene, composed from Hollow Knight: Silksong environment sprites
  (© Team Cherry, used as a non-commercial fan homage). Positions are in a
  1600 × 900 stage: --x/--w are stage units across, --t from the top, --b from the bottom.
{% endcomment %}
<div class="stage" aria-hidden="true">
  <div class="shafts"><span></span><span></span><span></span></div>

  <div class="layer far">
    <img class="sp" src="/img/moss/mound-a.webp" style="--x:180;--b:-40;--w:760" alt="">
    <img class="sp" src="/img/moss/mound-b.webp" style="--x:900;--b:60;--w:520" alt="">
    <img class="sp" src="/img/moss/mound-c.webp" style="--x:1180;--b:240;--w:300" alt="">
    <img class="sp flip" src="/img/moss/mound-c.webp" style="--x:380;--b:300;--w:260" alt="">
    <img class="sp sway" src="/img/moss/hang-a.webp" style="--x:520;--t:-30;--w:120" alt="">
    <img class="sp sway slow" src="/img/moss/hang-b.webp" style="--x:1060;--t:-40;--w:110" alt="">
    <img class="sp sway" src="/img/moss/drip-b.webp" style="--x:800;--t:-60;--w:80" alt="">
  </div>

  <div class="mist"></div>

  <div class="layer mid">
    <img class="sp flip" src="/img/moss/wall-a.webp" style="--x:-170;--b:120;--w:520" alt="">
    <img class="sp" src="/img/moss/wall-b.webp" style="--x:1290;--b:150;--w:470" alt="">
    <img class="sp" src="/img/moss/stalac-a.webp" style="--x:-60;--t:-70;--w:560" alt="">
    <img class="sp flip" src="/img/moss/stalac-a.webp" style="--x:1100;--t:-80;--w:560" alt="">
    <img class="sp" src="/img/moss/stalac-b.webp" style="--x:470;--t:-60;--w:220" alt="">
    <img class="sp flip" src="/img/moss/stalac-b.webp" style="--x:880;--t:-70;--w:200" alt="">
    <img class="sp sway" src="/img/moss/drip-a.webp" style="--x:400;--t:-30;--w:60" alt="">
    <img class="sp sway slow" src="/img/moss/vine-a.webp" style="--x:640;--t:-90;--w:130" alt="">
    <img class="sp sway" src="/img/moss/vine-b.webp" style="--x:1230;--t:-60;--w:130" alt="">
    <img class="sp sway slow" src="/img/moss/drip-b.webp" style="--x:1500;--t:-40;--w:80" alt="">

    <img class="sp" src="/img/moss/ledge-b.webp" style="--x:780;--b:60;--w:640" alt="">
    <img class="sp cage" src="/img/moss/cage.webp" style="--x:900;--b:205;--w:360" alt="">
    <img class="sp" src="/img/moss/moss-ball.webp" style="--x:1300;--b:190;--w:120" alt="">
    <img class="sp" src="/img/moss/clump-a.webp" style="--x:760;--b:200;--w:150" alt="">
  </div>

  <div class="layer near">
    <img class="sp" src="/img/moss/clump-front.webp" style="--x:-90;--b:-60;--w:600" alt="">
    <img class="sp flip" src="/img/moss/clump-set.webp" style="--x:1120;--b:-40;--w:560" alt="">
    <img class="sp" src="/img/moss/clump-set2.webp" style="--x:520;--b:-30;--w:420" alt="">
  </div>

  <div class="layer fg">
    <img class="sp" src="/img/moss/shroom-a.webp" style="--x:60;--b:-10;--w:240" alt="">
    <img class="sp" src="/img/moss/shroom-d.webp" style="--x:290;--b:-10;--w:140" alt="">
    <img class="sp flip" src="/img/moss/shroom-b.webp" style="--x:1380;--b:-10;--w:230" alt="">
    <img class="sp" src="/img/moss/shroom-c.webp" style="--x:1290;--b:-10;--w:70" alt="">
    <img class="sp" src="/img/moss/stalk-b.webp" style="--x:560;--b:-10;--w:60" alt="">
    <img class="sp" src="/img/moss/stalk-a.webp" style="--x:1110;--b:-10;--w:40" alt="">
    <img class="sp" src="/img/moss/leaf-a.webp" style="--x:240;--b:-10;--w:70" alt="">
    <img class="sp flip" src="/img/moss/leaf-b.webp" style="--x:1520;--b:-10;--w:80" alt="">
    <img class="sp" src="/img/moss/sway-b.webp" style="--x:-40;--b:-20;--w:190" alt="">
  </div>
</div>
