<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
(function () {
  try {
    var stored = localStorage.getItem("theme");
    var theme = stored || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  } catch (e) {}
})();
</script>
<title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="shortcut icon" type="image/png" href="/img/favicon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<nav class="site-nav">
  <div class="nav-inner">
    <a class="brand" href="/">
      <span class="brand-mark">BL</span>
      Bryan Lai
    </a>
    <div class="nav-links">
      <a href="/" {% if page.nav == 'home' %}class="active"{% endif %}>Home</a>
      <a href="/about" {% if page.nav == 'about' %}class="active"{% endif %}>About</a>
      <a href="/projects" {% if page.nav == 'projects' %}class="active"{% endif %}>Projects</a>
      <a href="/blog" {% if page.nav == 'blog' %}class="active"{% endif %}>Blog</a>
      <a href="/contact" {% if page.nav == 'contact' %}class="active"{% endif %}>Contact</a>
    </div>
    <div class="nav-cta">
      <a class="btn btn-primary" href="/img/resume.pdf" target="_blank" rel="noopener">
        <i class="fa-solid fa-file-arrow-down"></i> Resume
      </a>
      <button class="theme-toggle" type="button" aria-label="Toggle dark mode">
        <i class="fa-solid fa-moon"></i>
        <i class="fa-solid fa-sun"></i>
      </button>
      <button class="nav-toggle" type="button" aria-label="Toggle menu">
        <span></span>
      </button>
    </div>
  </div>
</nav>

<main>
{{ content }}
</main>

<footer class="site-footer">
  <div class="container footer-inner">
    <p>&copy; <span id="year">2026</span> Bryan Lai. Built with Jekyll.</p>
    <div class="footer-links">
      <a href="https://github.com/bryanlais" target="_blank" rel="noopener" aria-label="GitHub"><i class="fa-brands fa-github"></i></a>
      <a href="https://www.linkedin.com/in/bryanlais/" target="_blank" rel="noopener" aria-label="LinkedIn"><i class="fa-brands fa-linkedin-in"></i></a>
      <a href="mailto:bryanjlais@gmail.com" aria-label="Email"><i class="fa-solid fa-envelope"></i></a>
    </div>
  </div>
</footer>

<script src="/js/main.js"></script>
<script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
