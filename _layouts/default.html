<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
document.documentElement.classList.add("js");
(function () {
  try {
    var stored = localStorage.getItem("theme");
    if (stored === "dark" || stored === "light") document.documentElement.setAttribute("data-theme", stored);
  } catch (e) {}
})();
</script>
<title>{% if page.title and page.nav != 'home' %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}, software engineer{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<meta name="theme-color" content="#0b1711">
<link rel="shortcut icon" type="image/png" href="/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Cinzel:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
</head>
<body class="page-{{ page.nav | default: 'post' }}">

<a class="skip" href="#main">Skip to content</a>

<nav class="site-nav" aria-label="Main">
  <a class="wordmark" href="/">Bryan Lai</a>
  <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="nav-links">Menu</button>
  <ul class="nav-links" id="nav-links">
    <li><a href="/projects"{% if page.nav == 'projects' %} aria-current="page"{% endif %}>Projects</a></li>
    <li><a href="/about"{% if page.nav == 'about' %} aria-current="page"{% endif %}>About</a></li>
    <li><a href="/blog"{% if page.nav == 'blog' %} aria-current="page"{% endif %}>Blog</a></li>
    <li><a href="/contact"{% if page.nav == 'contact' %} aria-current="page"{% endif %}>Contact</a></li>
    <li class="only-phone"><a href="/img/resume.pdf" target="_blank" rel="noopener">Résumé</a></li>
  </ul>
  <button class="theme-toggle" type="button" aria-pressed="false" aria-label="Switch to daylight">
    <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 3.5a8.5 8.5 0 1 0 5 13.6A7 7 0 0 1 15.5 3.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="18.5" cy="6" r="1.3" fill="currentColor"/><circle cx="21" cy="10.5" r="0.8" fill="currentColor"/></svg>
    <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.6"/><g fill="currentColor"><path d="M12 1.5c1.2 1.6 1.2 3 0 4.3-1.2-1.3-1.2-2.7 0-4.3zM12 18.2c1.2 1.3 1.2 2.7 0 4.3-1.2-1.6-1.2-3 0-4.3zM1.5 12c1.6-1.2 3-1.2 4.3 0-1.3 1.2-2.7 1.2-4.3 0zM18.2 12c1.3-1.2 2.7-1.2 4.3 0-1.6 1.2-3 1.2-4.3 0z"/><path d="M4.6 4.6c2 .3 3 1.3 3 3-1.7 0-2.7-1-3-3zM16.4 16.4c1.7 0 2.7 1 3 3-2-.3-3-1.3-3-3zM19.4 4.6c-.3 2-1.3 3-3 3 0-1.7 1-2.7 3-3zM7.6 16.4c0 1.7-1 2.7-3 3 .3-2 1.3-3 3-3z"/></g></svg>
  </button>
  <a class="button button-ghost nav-action" href="/img/resume.pdf" target="_blank" rel="noopener">Résumé</a>
</nav>

<main id="main">
{{ content }}
</main>

<footer class="site-footer">
  <p>&copy; <span id="year">2026</span> Bryan Lai · Brooklyn, New York</p>
  <ul>
    <li><a href="mailto:{{ site.email }}">Email</a></li>
    <li><a href="https://github.com/bryanlais" rel="noopener">GitHub</a></li>
    <li><a href="https://www.linkedin.com/in/bryanlais/" rel="noopener">LinkedIn</a></li>
    <li><a href="/img/resume.pdf" target="_blank" rel="noopener">Résumé</a></li>
  </ul>
  <p class="colophon">Environment art from Hollow Knight: Silksong &copy; Team Cherry, used as a non-commercial fan homage.</p>
</footer>

<script src="/js/main.js"></script>
</body>
</html>
