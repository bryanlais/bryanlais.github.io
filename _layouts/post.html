---
layout: default
---
<article class="section post-article">
  <div class="container">
    <a class="back-link" href="/blog"><i class="fa-solid fa-arrow-left"></i> Back to blog</a>

    <div class="post-meta">
      <i class="fa-regular fa-calendar"></i> {{ page.date | date: "%B %-d, %Y" }}
    </div>
    <h1>{{ page.title }}</h1>

    <div class="post-content">
      {{ content }}
    </div>
  </div>
</article>
